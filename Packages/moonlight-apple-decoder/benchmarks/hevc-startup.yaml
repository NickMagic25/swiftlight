# The focused HEVC comparison with bounded startup admission time.
# Original arrival timestamps, every offered frame, and the steady queue limit
# remain in effect. This does not increase hardware decode speed.
schema_version: 1
defaults:
  codec: hevc
  dynamic_range: [sdr, hdr10]
  bitrate_mbps: [50, 100, 250, 350]
  gop: 60
  decoder:
    inflight: 2
    queue_depth: 16
    startup_grace_ms: 250
    power: -1
run:
  seconds: 10
  repetitions: 3
  warmup_frames: 120
  timeout_seconds: 180
thresholds:
  first_output_max_ms: 250
  bitrate_tolerance_pct: 20
  decoded_fps_ratio: 0.99
  latency_relative_pct: 5
  latency_absolute_ms: 0.1
cases:
  - name: ultrawide
    resolution: 3440x1440
    fps: 240
  - name: 4k
    resolution: 3840x2160
    fps: 60
