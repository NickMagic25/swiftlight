name: Decoder hardware comparison

# Run only after reviewing both revisions. Never attach this job to a PR event:
# CMake, Python, and decoder code execute directly on the physical runner.
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Full 40-character SHA of a reviewed Swiftlight monorepo baseline commit containing the decoder package
        required: true
        type: string
      configuration:
        description: Reviewed YAML path in the selected candidate branch
        required: true
        default: benchmarks/bitrate-matrix.yaml
        type: string

permissions:
  contents: read

# A single device must never benchmark two revisions or jobs concurrently.
concurrency:
  group: decoder-hardware-comparison
  cancel-in-progress: false

defaults:
  run:
    working-directory: Packages/moonlight-apple-decoder

jobs:
  compare:
    name: Paired physical VideoToolbox comparison
    runs-on: [self-hosted, macOS, ARM64, moonlight-video]
    timeout-minutes: 360
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CONFIGURATION: ${{ inputs.configuration }}
      MAV_AOMENC: ${{ vars.MAV_AOMENC }}
      MAV_FFMPEG_ROOT: ${{ vars.MAV_FFMPEG_ROOT }}
      MAV_DEVELOPER_DIR: ${{ vars.MAV_DEVELOPER_DIR }}
    steps:
      - name: Check out the selected candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate inputs and physical runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re
          if not re.fullmatch(r"[0-9a-fA-F]{40}", os.environ["BASELINE_SHA"]):
              raise SystemExit("baseline_sha must be a full 40-character commit SHA")
          root = pathlib.Path.cwd().resolve()
          config = (root / os.environ["CONFIGURATION"]).resolve()
          if not config.is_relative_to(root) or config.suffix not in (".yaml", ".yml") or not config.is_file():
              raise SystemExit("configuration must name an existing YAML file inside the candidate checkout")
          PY
          if [[ -n "$MAV_DEVELOPER_DIR" ]]; then
            printf 'DEVELOPER_DIR=%s\n' "$MAV_DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          aomenc_path="$MAV_AOMENC"
          if [[ -z "$aomenc_path" ]]; then
            aomenc_path="$(command -v aomenc || true)"
          fi
          if [[ ! -x "$aomenc_path" ]]; then
            echo 'Set repository variable MAV_AOMENC to a preinstalled aomenc executable, or put it on PATH.' >&2
            exit 1
          fi
          printf 'AOMENC=%s\n' "$aomenc_path" >> "$GITHUB_ENV"
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
      - name: Check out the reviewed baseline commit separately
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline_sha }}
          path: Packages/moonlight-apple-decoder/.local/ci-baseline
          persist-credentials: false
          submodules: recursive
      - name: Verify the baseline contains the monorepo decoder package
        shell: bash
        run: |
          if [[ ! -f .local/ci-baseline/Packages/moonlight-apple-decoder/CMakeLists.txt ]]; then
            echo 'baseline_sha must be a Swiftlight monorepo commit containing Packages/moonlight-apple-decoder. Standalone decoder commits are not supported by this workflow.' >&2
            exit 1
          fi
      - name: Install benchmark parser dependency
        run: python -m pip install --requirement scripts/requirements-benchmarks.txt
      - name: Validate independent software reference prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          from benchmark_config import load_config
          config = load_config(os.environ["CONFIGURATION"])
          required = any(case["bitrate_mbps"] is not None for case in config["cases"])
          prefix = os.environ.get("MAV_FFMPEG_ROOT", "")
          if required and not prefix:
              raise SystemExit("Explicit-bitrate cases require an independent software reference. Set repository variable MAV_FFMPEG_ROOT to a preinstalled FFmpeg prefix with include/, lib/, and software AV1/HEVC decoders.")
          if prefix:
              root = pathlib.Path(prefix).resolve()
              if not (root / "include/libavcodec/avcodec.h").is_file() or not (root / "lib").is_dir():
                  raise SystemExit("MAV_FFMPEG_ROOT must contain include/libavcodec/avcodec.h and lib/; provision the FFmpeg development files before dispatching.")
          PY
      - name: Test YAML configuration and comparison runner before building
        run: python -m unittest discover -s tests -p 'benchmark_*.py' -v
      - name: Validate example configurations without hardware
        run: |
          for configuration in benchmarks/*.yaml; do
            python scripts/compare-decoders.py --config "$configuration" --dry-run
          done
      - name: Capture build provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/hardware-build
          {
            git rev-parse HEAD
            git -C .local/ci-baseline rev-parse HEAD
            xcodebuild -version
            xcrun clang --version
            xcrun swift --version
            xcrun --sdk macosx --show-sdk-version
            cmake --version
            pmset -g batt
          } > results/hardware-build/provenance.log
          "$AOMENC" --help > results/hardware-build/aomenc-help.txt
      - name: Match replay harness for startup-aware comparisons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, sys
          sys.path.insert(0, str(pathlib.Path("scripts").resolve()))
          from benchmark_config import load_config
          config = load_config(os.environ["CONFIGURATION"])
          required = (config["thresholds"].get("first_output_max_ms") is not None or
                      any(case["decoder"].get("startup_grace_ms", 0) for case in config["cases"]))
          if not required:
              raise SystemExit(0)
          root = pathlib.Path.cwd()
          baseline = root / ".local/ci-baseline/Packages/moonlight-apple-decoder"
          evidence = root / "results/hardware-build/replay-harness"
          evidence.mkdir()
          manifest = {"baseline_revision": os.environ["BASELINE_SHA"],
                      "harness_revision": os.environ["GITHUB_SHA"],
                      "note": "Only offline replay sources are overlaid; baseline decoder sources and language mode are preserved.",
                      "files": {}}
          for name in ("replay.mm", "fixture_support.hpp", "replay_startup.h"):
              source, target = root / "tools" / name, baseline / "tools" / name
              if target.is_symlink():
                  raise SystemExit("baseline replay path must not be a symlink")
              before = hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
              shutil.copyfile(source, target)
              shutil.copyfile(source, evidence / name)
              manifest["files"]["tools/" + name] = {
                  "original_baseline_sha256": before,
                  "comparison_sha256": hashlib.sha256(target.read_bytes()).hexdigest()}
          (evidence / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Configure and build baseline
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .local/ci-baseline/Packages/moonlight-apple-decoder -B build-ci-baseline \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DMAV_BUILD_TOOLS=ON -DMAV_VT_EXPERIMENTS=OFF -DMAV_SANITIZE=OFF \
            2>&1 | tee results/hardware-build/baseline-configure.log
          cmake --build build-ci-baseline --parallel 3 2>&1 | tee results/hardware-build/baseline-build.log
          ctest --test-dir build-ci-baseline --output-on-failure --output-junit "$PWD/build-ci-baseline/ctest.xml" \
            2>&1 | tee results/hardware-build/baseline-test.log
      - name: Configure and build candidate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-ci-candidate \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DMAV_BUILD_TOOLS=ON -DMAV_VT_EXPERIMENTS=OFF -DMAV_SANITIZE=OFF \
            -DMAV_FFMPEG_ROOT="$MAV_FFMPEG_ROOT" \
            2>&1 | tee results/hardware-build/candidate-configure.log
          cmake --build build-ci-candidate --parallel 3 2>&1 | tee results/hardware-build/candidate-build.log
          ctest --test-dir build-ci-candidate --output-on-failure --output-junit "$PWD/build-ci-candidate/ctest.xml" \
            2>&1 | tee results/hardware-build/candidate-test.log
          swift run -c release mav-swift-smoke 2>&1 | tee results/hardware-build/swift-smoke.log
      - name: Verify bitrate, HDR, GOP, and imported fixture provenance before timing
        shell: bash
        run: |
          set -euo pipefail
          MAV_FIXTURE_TOOL=build-ci-candidate/mav-fixture python tests/benchmark_process_tests.py \
            2>&1 | tee results/hardware-build/encoder-timeout.log
          python tests/fixture_generation.py \
            --tool build-ci-candidate/mav-fixture --aomenc "$AOMENC" \
            --results-dir results/fixture-generation \
            2>&1 | tee results/hardware-build/fixture-generation.log
      - name: Prepare fixtures and run serial paired comparison
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MAV_FFMPEG_ROOT" ]]; then
            export DYLD_LIBRARY_PATH="$MAV_FFMPEG_ROOT/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          fi
          python scripts/compare-decoders.py \
            --config "$CONFIGURATION" \
            --candidate-build build-ci-candidate \
            --baseline-build build-ci-baseline \
            --fixture-build build-ci-candidate \
            --reference-tool build-ci-candidate/mav-reference-decode \
            --candidate-revision "$GITHUB_SHA" \
            --baseline-revision "$BASELINE_SHA" \
            --aomenc "$AOMENC" \
            --results-dir results/hardware
      - name: Publish comparison report in the job summary
        if: always()
        shell: bash
        run: |
          if [[ -f results/hardware/report.md ]]; then
            cat results/hardware/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve fixtures, raw measurements, reports, and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-hardware-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Packages/moonlight-apple-decoder/results/hardware/
            Packages/moonlight-apple-decoder/results/hardware-build/
            Packages/moonlight-apple-decoder/results/fixture-generation/
            Packages/moonlight-apple-decoder/build-ci-baseline/CMakeCache.txt
            Packages/moonlight-apple-decoder/build-ci-baseline/compile_commands.json
            Packages/moonlight-apple-decoder/build-ci-baseline/ctest.xml
            Packages/moonlight-apple-decoder/build-ci-baseline/Testing/Temporary/
            Packages/moonlight-apple-decoder/build-ci-candidate/CMakeCache.txt
            Packages/moonlight-apple-decoder/build-ci-candidate/compile_commands.json
            Packages/moonlight-apple-decoder/build-ci-candidate/ctest.xml
            Packages/moonlight-apple-decoder/build-ci-candidate/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 30
